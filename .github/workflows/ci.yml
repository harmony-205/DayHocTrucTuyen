name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore DayHocTrucTuyen.sln

    - name: Build solution (Release)
      run: dotnet build DayHocTrucTuyen.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test DayHocTrucTuyen.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  docker-verify:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: docker build -t dayhoctructuyen:ci-test .
